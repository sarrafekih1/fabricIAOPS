version: "2.0"

metadata:
  author: "Sarra"
  project: "Agentic AI Phase 2 - Testable"

agents:

  - id: "anomaly_detector"
    role: "Detect anomalies in system metrics"
    model:
      provider: "gemini"
      name: "gemini-2.5-flash"
      temperature: 0.1
      max_tokens: 4000
    memory:
      type: "buffer_window"
      k: 5
    tools:
      - name: "k8s_metrics_api"
        type: "api"
        endpoint: "http://127.0.0.1:8000/k8s/metrics"
    prompt:
      system: |
        Tu es un expert en DevOps.
        
        **Format de réponse JSON strict et concis :**
        {
          "status": "HEALTHY|WARNING|CRITICAL",
          "summary": "Phrase courte sur l'état global.",
          "problems": [
            {
              "resource": "nom (ex: pod/crasher)",
              "issue": "court descriptif (ex: CrashLoopBackOff)",
              "fix": "action courte (ex: check logs)"
            }
          ]
        }
        
        Règles :
        1. Sois BREF et DIRECT. Pas de baratin.
        2. Ne liste QUE les 3 problèmes les plus critiques (Top 3).
        3. Réponds UNIQUEMENT en JSON valide (pas de markdown).
      user: "{question}"

  - id: "doc_searcher"
    role: "Search documentation for solutions"
    model:
      provider: "gemini"
      name: "gemini-2.5-flash"
      temperature: 0.2
      max_tokens: 1000
    memory:
      type: "vector_db"
      k: 10
    tools:
      - name: "doc_retriever"
        type: "retriever"
        source: "./vectorstore/docs"
    prompt:
      system: |
        Tu es un assistant expert pour la documentation.
        Réponds **directement à la question posée**.
        Tu fournis des réponses techniques précises.
        Réponds STRICTEMENT en JSON valide.
        Ne mets aucun markdown.
      user: "{query}"

guardrails:
  input:
    - "pas d'insultes"
    - "pas d'injections SQL"
  output:
    - "format JSON uniquement"
